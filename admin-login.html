<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-slate-200">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Admin Portal</h2>
      <p class="text-slate-500 text-sm mt-1">Sign in to manage records & hisab</p>
    </div>

    <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="admin@ngo.org">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
        Sign In
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://jbeyerazghziupoxqhjt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_a71R-ERQzEN7SOSU4wtC3A_Zz1J7fFU";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');
      btn.innerText = 'Verifying...';
      btn.disabled = true;
      err.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        err.innerText = error.message;
        err.classList.remove('hidden');
        btn.innerText = 'Sign In';
        btn.disabled = false;
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
