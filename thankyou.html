<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - Citizen Welfare Foundation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; padding: 30px 15px; color: #1e293b; }
    .container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    
    .thankyou-card {
      background: #ecfdf5;
      border: 1.5px solid #a7f3d0;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 30px;
    }
    .thankyou-card h1 { color: #065f46; font-size: 24px; margin-bottom: 8px; }
    .thankyou-card p { color: #047857; font-size: 15px; line-height: 1.5; }
    
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .table-header h3 { font-size: 18px; color: #1e293b; }

    .table-responsive { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f1f5f9; padding: 12px; font-size: 13px; color: #64748b; font-weight: 600; border-radius: 6px; }
    td { padding: 14px 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    
    .amount-badge { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 13px; }
    .footer-link { text-align: center; margin-top: 25px; }
    .footer-link a { color: #16a34a; font-weight: 600; text-decoration: none; font-size: 15px; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <!-- Dynamic Thank You Box -->
  <div class="thankyou-card">
    <h1 id="thankTitle">Thank You for Your Donation! 🙏</h1>
    <p id="thankSub">Citizen Welfare Foundation thanks you for your generous support.</p>
  </div>

  <!-- Donations Table -->
  <div class="table-header">
    <h3>Recent Donors</h3>
    <span style="font-size: 12px; color: #64748b;">Live Updates</span>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Donor Name</th>
          <th>Amount</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="donationsList">
        <tr><td colspan="3" style="text-align: center; padding: 20px; color: #94a3b8;">Loading donors list...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer-link">
    <a href="index.html">← Return to Citizen Welfare Foundation</a>
  </div>
</div>

<script>
  // 1. URL se Name aur Amount read karna
  const urlParams = new URLSearchParams(window.location.search);
  const donorName = urlParams.get('name');
  const donorAmount = urlParams.get('amount');

  if (donorName) {
    document.getElementById('thankTitle').innerText = `Thank you for your donation, ${donorName}! 🙏`;
    if (donorAmount) {
      document.getElementById('thankSub').innerText = `We have recorded your contribution of ₹${donorAmount}. Your support empowers our community initiatives!`;
    }
  }

  // 2. Supabase config
  const SUPABASE_URL = "https://catlfwebknujpccibizm.supabase.co/rest/v1/";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhdGxmd2Via251anBjY2liaXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwOTYxMzMsImV4cCI6MjEwODY3MjEzM30.MHLuGsTj8Ul-qM8aYSq3yeTEbkmSgYTYUmNg7Q_TbrM";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 3. Table data fetch karna
  async function fetchDonors() {
    const { data, error } = await supabase
      .from('donations')
      .select('donor_name, amount, created_at')
      .order('created_at', { ascending: false })
      .limit(15);

    const tbody = document.getElementById('donationsList');
    tbody.innerHTML = '';

    if (error || !data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 15px; color: #94a3b8;">No donations recorded yet.</td></tr>';
      return;
    }

    data.forEach(item => {
      const formattedDate = new Date(item.created_at).toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });

      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${item.donor_name}</strong></td>
        <td><span class="amount-badge">₹${item.amount}</span></td>
        <td style="color: #64748b; font-size: 13px;">${formattedDate}</td>
      `;
      tbody.appendChild(row);
    });
  }

  fetchDonors();
</script>

</body>
</html>
